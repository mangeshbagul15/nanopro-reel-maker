name: Keep Streamlit App Alive

on:
  schedule:
    # Runs every 6 hours to prevent sleep mode
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -I -s -L "https://nanopro-reel-maker.streamlit.app/"
